name: gpio
description: >-
  Linux GPIO from pure Dart over the /dev/gpiochip v2 ABI — no native
  library. Kernel debounce, edge-event streams with kernel timestamps, and
  dropped-edge detection.
version: 0.1.1
repository: https://github.com/tomassasovsky/gpio
issue_tracker: https://github.com/tomassasovsky/gpio/issues
topics:
  - gpio
  - linux
  - embedded
  - raspberry-pi
  - ffi

environment:
  sdk: ^3.6.0

dependencies:
  ffi: ^2.1.3
  meta: ^1.16.0

dev_dependencies:
  ffigen: ^19.1.0
  test: ^1.25.0
  very_good_analysis: ^10.0.0
  yaml: ^3.1.2
