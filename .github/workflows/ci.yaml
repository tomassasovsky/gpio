name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  # The ABI test asserts that Dart's struct layout matches the kernel's on the
  # architecture it runs on. Running it on one architecture proves nothing
  # about the others, which is the entire point of having it.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Test (${{ matrix.arch }})
        run: dart test

  # The real ioctl path, against a kernel-provided simulated chip. Everything
  # else runs against FakeKernel, which is a model of the kernel written by the
  # same hand as the code it checks -- this is the job that would catch a shared
  # misunderstanding.
  #
  # The runner's Azure kernel carries no gpio-sim in its base package, which is
  # what made this permanently warn-and-skip. Ubuntu ships the driver in
  # linux-modules-extra-<release> instead, so the fix is to install the module
  # set rather than to boot a QEMU VM with a distro kernel -- which was the
  # other candidate, and is dramatically more machinery for the same result.
  #
  # There is no warn-and-skip path any more. A skip that keeps the build green
  # reads as "covered" and this suite spent its whole life so far not running.
  # If gpio-sim cannot be loaded, that is now a failure to be fixed, not a
  # notice to be scrolled past.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Install the kernel module set carrying gpio-sim
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || {
            echo "::error::No linux-modules-extra for $(uname -r)."
            echo "The runner image kernel changed. Check what is available:"
            apt-cache search "linux-modules-extra" | head -20
            exit 1
          }
      - name: Load gpio-sim
        run: |
          sudo mountpoint -q /sys/kernel/config || \
            sudo mount -t configfs none /sys/kernel/config
          sudo modprobe gpio-sim
          test -d /sys/kernel/config/gpio-sim || {
            echo "::error::gpio-sim loaded but configfs group is missing."
            exit 1
          }
          echo "gpio-sim is loaded and configfs is mounted"
      - name: Integration tests against gpio-sim
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" dart test -t integration \
            | tee /tmp/integration.log
          # The suite skips itself when GpioSim.isAvailable is false, which
          # would pass this job having executed nothing -- the exact failure
          # mode this job exists to end. A skip here is now a hard error.
          if grep -qE '[~][0-9]+' /tmp/integration.log; then
            echo "::error::The integration suite skipped instead of running."
            echo "gpio-sim loaded, so GpioSim.isAvailable disagrees -- check"
            echo "the configfs path and permissions it probes."
            exit 1
          fi

  # A self-contained binary for bench work, because the boards this package
  # targets do not have a Dart runtime -- a Yocto image has no `dart` CLI, and
  # a Flutter release bundle is AOT with nothing invocable in it. Built on an
  # arm64 runner so it lands on a Pi as one scp with no toolchain.
  #
  # `dart compile exe` links against the build host's glibc, so the runner's
  # version is printed here: if the target's is older the binary will not load,
  # and the fallback is compiling in a container matching the target.
  hw-check-binary:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile
        run: |
          dart compile exe tool/hw_check.dart -o gpio-hwcheck-arm64
          echo "built against: $(ldd --version | head -1)"
          ./gpio-hwcheck-arm64 --help || true
      - uses: actions/upload-artifact@v4
        with:
          name: gpio-hwcheck-arm64
          path: gpio-hwcheck-arm64
          if-no-files-found: error

  # 32-bit ARM has no Dart-capable GitHub runner, so the layout claim is checked
  # against the real kernel header with a 32-bit compiler instead. Cheaper than
  # emulating a whole toolchain, and it tests the same proposition.
  abi-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install a 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Assert the uAPI layout is width-independent
        run: bash tool/check_abi_32bit.sh
