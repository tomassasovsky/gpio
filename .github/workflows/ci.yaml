name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  # The ABI test asserts that Dart's struct layout matches the kernel's on the
  # architecture it runs on. Running it on one architecture proves nothing
  # about the others, which is the entire point of having it.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Test (${{ matrix.arch }})
        run: dart test

  # The real ioctl path, against a kernel-provided simulated chip. Everything
  # else runs against FakeKernel, which is a model of the kernel written by the
  # same hand as the code it checks -- this is the job that would catch a shared
  # misunderstanding.
  #
  # KNOWN: GitHub's hosted runners cannot run it. Their Azure kernel ships no
  # gpio-sim module ("modprobe: FATAL: Module gpio-sim not found in directory
  # /lib/modules/6.17.0-1022-azure"), so this job currently always takes the
  # warn-and-skip path. It is kept green-but-loud on purpose: the suite runs
  # unchanged on any machine whose kernel has CONFIG_GPIO_SIM, including a
  # Raspberry Pi, and that is where it earns its keep. Getting it running in CI
  # would mean booting a QEMU VM with a stock distro kernel.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Load gpio-sim
        id: sim
        run: |
          sudo mountpoint -q /sys/kernel/config || \
            sudo mount -t configfs none /sys/kernel/config || true
          sudo modprobe gpio-sim || true
          if [ -d /sys/kernel/config/gpio-sim ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "gpio-sim is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gpio-sim unavailable on this runner -- the"\
                 "integration suite did NOT run. The fake-kernel suite is"\
                 "what gates this build."
          fi
      - name: Integration tests against gpio-sim
        if: steps.sim.outputs.available == 'true'
        run: sudo -E env "PATH=$PATH" dart test -t integration

  # 32-bit ARM has no Dart-capable GitHub runner, so the layout claim is checked
  # against the real kernel header with a 32-bit compiler instead. Cheaper than
  # emulating a whole toolchain, and it tests the same proposition.
  abi-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install a 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Assert the uAPI layout is width-independent
        run: bash tool/check_abi_32bit.sh
