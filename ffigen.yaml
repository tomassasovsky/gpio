# Regenerate with: dart run ffigen
#
# Bindings are generated from the kernel's own uapi header, which is licensed
# `GPL-2.0 WITH Linux-syscall-note`. That syscall-note exception is precisely
# what permits a userspace program under any licence (here MIT) to use these
# definitions. libgpiod is LGPL and is deliberately NOT a source for this file.
name: GpioUapi
description: Raw bindings for the Linux GPIO character-device uAPI (v2).
output: 'lib/src/ffi/gpio_uapi.dart'
headers:
  entry-points:
    - '/usr/include/linux/gpio.h'
  include-directives:
    - '**/linux/gpio.h'
structs:
  include:
    - 'gpiochip_info'
    - 'gpio_v2_.*'
enums:
  include:
    - 'gpio_v2_.*'
macros:
  include:
    - 'GPIO_MAX_NAME_SIZE'
    - 'GPIO_V2_LINES_MAX'
    - 'GPIO_V2_LINE_NUM_ATTRS_MAX'
functions:
  include:
    - '^$'   # none: every call goes through lib/src/ffi/libc.dart
comments:
  style: any
  length: full
preamble: |
  // GENERATED by `dart run ffigen` from <linux/gpio.h>. Do not edit by hand.
  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names
